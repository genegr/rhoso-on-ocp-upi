---
# Read-only: which switch port sits behind each NIC of the data-plane hosts' trunk bond. Listens on every bond
# member for one LLDP or CDP frame from the switch (tcpdump, nothing configured on the host, nothing sent).
# Report: .state/<env>/lldp-report.md.
#   ansible-playbook playbooks/lldp.yml -e env=<name> [-e lldp_wait=70] [-l <host>]
- name: Environment
  hosts: localhost
  gather_facts: false
  roles:
    - env_model

- name: Switch ports behind the bond members
  hosts: edpm
  gather_facts: true
  vars:
    e: "{{ hostvars['localhost'].e }}"
    lldp_wait: 70                # LLDP default interval 30 s, CDP 60 s
    lldp_bond: "{{ (e.edpm_hosts | selectattr('name', 'equalto', inventory_hostname) | first).trunk_nic
                   | default(e.netcheck.trunk_nic, true) | default(ansible_facts.default_ipv4.interface, true) }}"
  tasks:
    - name: Bond members
      ansible.builtin.set_fact:
        lldp_nics: "{{ ansible_facts[lldp_bond | replace('-', '_')].slaves | default([lldp_bond]) }}"

    - name: tcpdump is installed
      ansible.builtin.stat:
        path: /usr/sbin/tcpdump
      register: lldp_tcpdump
      failed_when: not lldp_tcpdump.stat.exists

    - name: Listen for one LLDP or CDP frame per NIC (all NICs in parallel)
      ansible.builtin.command:
        argv: [timeout, "{{ lldp_wait }}", /usr/sbin/tcpdump, -i, "{{ item }}", -nn, -vv, -e, -c, "1", -s, "1500",
               "ether proto 0x88cc or ether dst 01:00:0c:cc:cc:cc"]
      loop: "{{ lldp_nics }}"
      async: "{{ lldp_wait | int + 30 }}"
      poll: 0
      changed_when: false
      register: lldp_jobs
      check_mode: false

    - name: Wait for the captures
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ lldp_jobs.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: lldp_cap
      until: lldp_cap.finished
      retries: "{{ (lldp_wait | int + 30) // 5 }}"
      delay: 5
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Parse switch name, port and native VLAN
      ansible.builtin.set_fact:
        lldp_ports: >-
          {%- set out = [] -%}
          {%- for r in lldp_cap.results -%}
          {%-   set s = r.stdout | default('') -%}
          {%-   set proto = 'lldp' if 'LLDP' in s else ('cdp' if 'CDP' in s else 'none') -%}
          {%-   if proto == 'lldp' -%}
          {%-     set sw = s | regex_search('System Name TLV \\(5\\), length \\d+: (\\S+)', '\\1') -%}
          {%-     set port = s | regex_search('Port ID TLV \\(2\\), length \\d+\\s+Subtype [^:]+: (\\S+)', '\\1') -%}
          {%-     set pdesc = s | regex_search('Port Description TLV \\(4\\), length \\d+: (.+)', '\\1') -%}
          {%-     set vlan = s | regex_search('\\(PVID\\): (\\d+)', '\\1') -%}
          {%-     set mtu = none -%}
          {%-   elif proto == 'cdp' -%}
          {%-     set sw = s | regex_search("System Name \\(0x14\\), value length: \\d+ bytes: '([^']+)'", '\\1') -%}
          {%-     set port = s | regex_search("Port-ID \\(0x03\\), value length: \\d+ bytes: '([^']+)'", '\\1') -%}
          {%-     set pdesc = none -%}
          {%-     set vlan = s | regex_search('Native VLAN ID \\(0x0a\\), value length: \\d+ bytes: (\\d+)', '\\1') -%}
          {%-     set mtu = s | regex_search('MTU \\(0x11\\), value length: \\d+ bytes: (\\d+)', '\\1') -%}
          {%-   endif -%}
          {%-   set _ = out.append({'nic': r.item.item,
                                    'mac': (ansible_facts[r.item.item | replace('-', '_')] | default({})).perm_macaddress
                                           | default((ansible_facts[r.item.item | replace('-', '_')] | default({})).macaddress | default('')),
                                    'proto': proto,
                                    'switch': (sw | first) if sw else '',
                                    'port': (port | first) if port else '',
                                    'port_desc': (pdesc | first | trim) if pdesc else '',
                                    'native_vlan': (vlan | first) if vlan else '',
                                    'mtu': (mtu | first) if mtu else '',
                                    'raw': s}) -%}
          {%- endfor -%}
          {{ out }}

- name: Report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Write .state/<env>/lldp-report.md
      ansible.builtin.copy:
        dest: "{{ state_dir }}/lldp-report.md"
        mode: "0600"
        content: |
          # Switch ports behind the data-plane hosts' trunk bonds ({{ e.env }})
          Generated by `playbooks/lldp.yml` (one LLDP/CDP frame captured per bond member).

          | Host | NIC | MAC | Proto | Switch | Port | Port description | Native VLAN | Port MTU (CDP) |
          |---|---|---|---|---|---|---|---|---|
          {% for h in groups['edpm'] if hostvars[h].lldp_ports is defined %}
          {% for p in hostvars[h].lldp_ports %}
          | {{ h }} | {{ p.nic }} | {{ p.mac }} | {{ p.proto }} | {{ p.switch }} | {{ p.port }} | {{ p.port_desc }} | {{ p.native_vlan }} | {{ p.mtu }} |
          {% endfor %}
          {% endfor %}

          ## Raw frames
          {% for h in groups['edpm'] if hostvars[h].lldp_ports is defined %}
          {% for p in hostvars[h].lldp_ports %}
          ### {{ h }} {{ p.nic }}
          ```
          {{ p.raw | default('(nothing received)', true) }}
          ```
          {% endfor %}
          {% endfor %}

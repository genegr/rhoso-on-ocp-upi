---
# vault_rhoso_admin_password on a running control plane. A changed AdminPassword in osp-secret alone reconfigures the
# clients but not Keystone (RHOSO 18.0: passwords in osp-secret can't be changed after deployment; the keystone-operator
# doesn't rerun its bootstrap), so every admin login gets 401. Keystone first, through its API, then osp-secret:
#   1. admin logs in with the vault password: nothing to do;
#   2. else a token as admin with the live osp-secret password (the normal rotation), or else as the placement service
#      user (admin role in project service; for an osp-secret that already holds the new password, as on 2026-11-14);
#   3. PATCH the admin user's password with that token.
# A fresh deployment skips all this: Keystone doesn't exist yet and its bootstrap takes the password from osp-secret.
- name: KeystoneAPI (does Keystone already run?)
  kubernetes.core.k8s_info:
    api_version: keystone.openstack.org/v1beta1
    kind: KeystoneAPI
    namespace: "{{ rhoso_namespace }}"
  register: cp_ks_api

- name: Admin password in Keystone
  when: cp_ks_api.resources | length > 0 and not ansible_check_mode
  vars:
    cp_ks_url: "https://keystone-public-{{ rhoso_namespace }}.apps.{{ e.domain }}"
    cp_ks_ca: "{{ state_dir }}/rhoso-public-ca.crt"
  block:
    - name: Public CA (rootca-public)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ rhoso_namespace }}"
        name: rootca-public
      register: cp_ca_secret
      no_log: true

    - name: CA file
      ansible.builtin.copy:
        content: "{{ cp_ca_secret.resources[0].data['ca.crt'] | b64decode }}"
        dest: "{{ cp_ks_ca }}"
        mode: "0644"

    - name: Admin logs in with the vault password
      ansible.builtin.uri:
        url: "{{ cp_ks_url }}/v3/auth/tokens"
        method: POST
        ca_path: "{{ cp_ks_ca }}"
        body_format: json
        body: {auth: {identity: {methods: [password], password: {user: {name: admin, domain: {id: default},
               password: "{{ vault_rhoso_admin_password }}"}}}}}
        status_code: [201, 401]
      register: cp_admin_new
      no_log: true

    - name: Live osp-secret (current passwords)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ rhoso_namespace }}"
        name: osp-secret
      register: cp_osp_live
      no_log: true
      when: cp_admin_new.status == 401

    - name: Token to change it (admin with the live password, else the placement service user)
      ansible.builtin.uri:
        url: "{{ cp_ks_url }}/v3/auth/tokens"
        method: POST
        ca_path: "{{ cp_ks_ca }}"
        body_format: json
        body: {auth: {identity: {methods: [password], password: {user: {name: "{{ item.user }}", domain: {id: default},
               password: "{{ cp_osp_live.resources[0].data[item.key] | b64decode }}"}}},
               scope: {project: {name: "{{ item.project }}", domain: {id: default}}}}}
        status_code: [201, 401]
      loop:
        - {user: admin, key: AdminPassword, project: admin}
        - {user: placement, key: PlacementPassword, project: service}
      loop_control:
        label: "{{ item.user }}"
      register: cp_admin_tokens
      no_log: true
      when: cp_admin_new.status == 401

    - name: Admin user in Keystone
      ansible.builtin.uri:
        url: "{{ cp_ks_url }}/v3/users?name=admin&domain_id=default"
        headers: {X-Auth-Token: "{{ cp_tok }}"}
        ca_path: "{{ cp_ks_ca }}"
      vars:
        cp_tok: "{{ (cp_admin_tokens.results | selectattr('status', 'equalto', 201) | first).x_subject_token }}"
      register: cp_admin_user
      no_log: true
      when: cp_admin_new.status == 401

    - name: Set the admin password in Keystone (before osp-secret)
      ansible.builtin.uri:
        url: "{{ cp_ks_url }}/v3/users/{{ cp_admin_user.json.users[0].id }}"
        method: PATCH
        headers: {X-Auth-Token: "{{ cp_tok }}"}
        ca_path: "{{ cp_ks_ca }}"
        body_format: json
        body: {user: {password: "{{ vault_rhoso_admin_password }}"}}
        status_code: [200]
      vars:
        cp_tok: "{{ (cp_admin_tokens.results | selectattr('status', 'equalto', 201) | first).x_subject_token }}"
      changed_when: true
      no_log: true
      when: cp_admin_new.status == 401

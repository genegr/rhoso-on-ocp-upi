---
# Deploying RHOSO 18.0, "Creating the control plane", with the Pure FlashArray iSCSI back end for Cinder (certified
# partner image through OpenStackVersion customContainerImages) and Glance on Cinder. CR layout from
# openstack-k8s-operators/architecture lib/control-plane (the base of the RHOSO examples), checked against the
# installed CRDs by a server-side dry run.
- name: Nodes and their interfaces
  ansible.builtin.include_role:
    name: rhoso_networks
    tasks_from: ifaces

- name: Values
  ansible.builtin.set_fact:
    cp: "{{ e.rhoso.controlplane }}"
    cp_net: "{{ e.rhoso.networks | items2dict(key_name='name', value_name='cidr') }}"
    cp_osp_dir: "{{ state_dir }}/osp-secret"
    cp_pure_token_file: "{{ state_dir }}/flasharray-{{ e.rhoso.cinder.flasharray.user }}.token"
    cp_ovn_nic: "{{ (rn_pg_ifaces.values() | first)[e.rhoso.controlplane.ovn_datacentre_portgroup] }}"

- name: The OVN datacentre NIC has the same name on every node
  ansible.builtin.assert:
    that: rn_pg_ifaces.values() | map(attribute=cp.ovn_datacentre_portgroup) | unique | list | length == 1
    quiet: true

- name: RHOSO release deployed by the installed openstack-operator
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: openstack-operators
    name: "{{ (rhoso_operators_defaults | combine(e.rhoso.operators | default({}), recursive=true)).openstack.csv }}"
  register: os_csv

- name: Release version and Pure image tag agree
  ansible.builtin.set_fact:
    cp_release: >-
      {{ os_csv.resources[0].spec.install.spec.deployments | map(attribute='spec.template.spec.containers') | flatten
         | map(attribute='env') | flatten | selectattr('name', 'equalto', 'OPENSTACK_RELEASE_VERSION')
         | map(attribute='value') | first }}
  failed_when: >-
    not cp_release.startswith(e.rhoso.cinder.image.split(':')[-1] ~ '-')

- name: Cinder user's token is there (flasharray phase)
  ansible.builtin.stat:
    path: "{{ cp_pure_token_file }}"
  register: pure_token
  failed_when: not pure_token.stat.exists

- name: osp-secret directory
  ansible.builtin.file:
    path: "{{ cp_osp_dir }}"
    state: directory
    mode: "0700"

# vault_rhoso_admin_password (optional): the admin password, written over the generated file. On a new control plane
# osp-secret carries it to Keystone's bootstrap; on a running one Keystone gets it first through its API
# (admin_password.yml), then osp-secret and with it the openstackclient's clouds config.
- name: Admin password into Keystone first (running control plane)
  ansible.builtin.include_tasks: admin_password.yml
  when: vault_rhoso_admin_password is defined

- name: AdminPassword from the vault
  ansible.builtin.copy:
    content: "{{ vault_rhoso_admin_password }}"
    dest: "{{ cp_osp_dir }}/AdminPassword"
    mode: "0600"
  when: vault_rhoso_admin_password is defined
  no_log: true

- name: osp-secret (passwords generated once, kept in .state)
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: osp-secret
        namespace: "{{ rhoso_namespace }}"
      stringData: >-
        {%- set out = {} -%}
        {%- for k in rhoso_osp_secret_keys -%}
        {%-   set _ = out.update({k: lookup('ansible.builtin.password', cp_osp_dir ~ '/' ~ k,
                                         length=32, chars=['ascii_letters', 'digits'])}) -%}
        {%- endfor -%}
        {%- set _ = out.update({'BarbicanSimpleCryptoKEK': lookup('ansible.builtin.password',
                                 cp_osp_dir ~ '/BarbicanSimpleCryptoKEK-raw', length=32,
                                 chars=['ascii_letters', 'digits']) | b64encode}) -%}
        {{ out }}
  register: cp_osp_secret
  no_log: true

- name: Cinder Pure back end secret (API token of the dedicated array user)
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: cinder-volume-pure-secret
        namespace: "{{ rhoso_namespace }}"
      stringData:
        pure-secrets.conf: |
          [pure]
          pure_api_token = {{ lookup('ansible.builtin.file', cp_pure_token_file) | trim }}
  no_log: true

- name: OpenStackVersion (release + certified Pure cinder-volume image)
  kubernetes.core.k8s:
    definition:
      apiVersion: core.openstack.org/v1beta1
      kind: OpenStackVersion
      metadata:
        name: "{{ rhoso_controlplane_name }}"
        namespace: "{{ rhoso_namespace }}"
      spec:
        targetVersion: "{{ cp_release }}"
        customContainerImages:
          cinderVolumeImages:
            pure: "{{ e.rhoso.cinder.image }}"

- name: OpenStackControlPlane rendered (kept in .state for review; no secrets in it)
  ansible.builtin.template:
    src: openstackcontrolplane.yaml.j2
    dest: "{{ state_dir }}/openstackcontrolplane.yaml"
    mode: "0600"
  check_mode: false
  changed_when: false

- name: OpenStackControlPlane
  kubernetes.core.k8s:
    src: "{{ state_dir }}/openstackcontrolplane.yaml"

- name: Control plane Ready
  kubernetes.core.k8s_info:
    api_version: core.openstack.org/v1beta1
    kind: OpenStackControlPlane
    name: "{{ rhoso_controlplane_name }}"
    namespace: "{{ rhoso_namespace }}"
  register: cp_state
  until: >-
    (cp_state.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready')
     | map(attribute='status') | first | default('')) == 'True'
  retries: 120
  delay: 30
  when: not ansible_check_mode

# Gateway candidates = chassis with enable-chassis-as-gw AND a bridge mapping for the external physnet (datacentre).
# The OCP nodes must not be candidates: the template has no nicMappings and the flag false. The k8s module merges
# into the live OpenStackControlPlane, so a removed nicMappings stays there: remove it with a JSON patch. The operator
# then rolls ovn-controller(-ovs), whose start scripts drop the bridge mapping. (A rollout restart of its DaemonSets
# by hand is reverted by the operator, and the flag alone never reached running nodes.)
- name: Live OpenStackControlPlane (ovnController)
  kubernetes.core.k8s_info:
    api_version: core.openstack.org/v1beta1
    kind: OpenStackControlPlane
    namespace: "{{ rhoso_namespace }}"
    name: "{{ rhoso_controlplane_name }}"
  register: cp_live
  when: not ansible_check_mode

- name: Remove nicMappings from the OCP nodes' ovn-controller
  kubernetes.core.k8s_json_patch:
    api_version: core.openstack.org/v1beta1
    kind: OpenStackControlPlane
    namespace: "{{ rhoso_namespace }}"
    name: "{{ rhoso_controlplane_name }}"
    patch:
      - op: remove
        path: /spec/ovn/template/ovnController/nicMappings
  when:
    - not ansible_check_mode
    - not (cp.ocp_nodes_gateway | default(false) | bool)
    - cp_live.resources[0].spec.ovn.template.ovnController.nicMappings | default({}) | length > 0

- name: No OCP node is a gateway candidate (OVN SB, after the operator's rollout)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: ovsdbserver-sb-0
    container: ovsdbserver-sb
    command: ovn-sbctl --no-leader-only --format=csv --data=bare --no-headings --columns=hostname,other_config list Chassis
  register: cp_chassis_after
  until: >-
    cp_chassis_after.stdout_lines | select('search', 'enable-chassis-as-gw') | select('search', 'ovn-bridge-mappings=[^ ]*datacentre')
    | map('regex_replace', ',.*$', '') | select('in', rn_nodes | map(attribute='hostname') | list) | list | length == 0
  retries: 60
  delay: 10
  changed_when: false
  when: not ansible_check_mode and not (cp.ocp_nodes_gateway | default(false) | bool)

# A changed osp-secret (e.g. a new AdminPassword) rolls Keystone and recreates the openstackclient pod while the
# control plane still reads Ready: the CLI calls below got 401 until both had rolled (found 2026-11-14).
- name: Admin login works from the openstackclient pod (after an osp-secret change)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack token issue -f value -c expires
  register: cp_login
  until: cp_login.rc | default(1) == 0
  retries: 60
  delay: 10
  changed_when: false
  when: not ansible_check_mode and cp_osp_secret is changed

# Without nicMappings the OCP nodes run no ovn-controller, but their old chassis stay in Neutron as dead
# "OVN Controller Gateway agent" entries (found 2026-11-14): delete those of the OCP nodes once they're dead.
- name: Network agents (current)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack network agent list -f json
  register: cp_agents
  changed_when: false
  check_mode: false                       # read-only
  when: not (cp.ocp_nodes_gateway | default(false) | bool)

- name: Dead OVN agents of the OCP nodes removed
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack network agent delete {{ item.ID }}
  loop: >-
    {{ cp_agents.stdout | default('[]') | from_json | selectattr('Host', 'in', rn_nodes | map(attribute='hostname') | list)
       | rejectattr('Alive') | list }}
  loop_control:
    label: "{{ item.Host }} ({{ item['Agent Type'] }})"
  when: not ansible_check_mode and not (cp.ocp_nodes_gateway | default(false) | bool)

# Volume type for the Pure back end, Cinder's default_volume_type (customServiceConfig in the template). The toolbox has
# no OpenStack SDK: the CLI runs in the openstackclient pod, as the docs do. Read first, create only when missing.
- name: Volume type {{ cinder_volume_type }} (current)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack volume type show {{ cinder_volume_type }} -f json
  register: cp_vtype
  changed_when: false
  failed_when: false
  check_mode: false                       # read-only

# properties: a dict in recent clients, "key='value'" text in older ones; the search covers both.
- name: Volume type {{ cinder_volume_type }} -> back end {{ cinder_backend }}
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: >-
      openstack volume type {{ 'create --public' if cp_vtype.rc | default(1) != 0 else 'set' }}
      --property volume_backend_name={{ cinder_backend }}
      --description "Everpure FlashArray (iSCSI, multipath)" {{ cinder_volume_type }}
  when: >-
    not ansible_check_mode and (
    cp_vtype.rc | default(1) != 0
    or (cp_vtype.stdout | from_json).properties | default('') | string
       is not search('volume_backend_name\\W+' ~ cinder_backend ~ '\\b'))

- name: Volume type {{ glance_volume_type }} (current)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack volume type show {{ glance_volume_type }} -f json
  register: cp_gtype
  changed_when: false
  failed_when: false
  check_mode: false                       # read-only

- name: Project service (Glance's image volumes)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack project show service -f value -c id
  register: cp_service_project
  changed_when: false
  check_mode: false                       # read-only

- name: Volume type {{ glance_volume_type }} -> back end {{ cinder_backend }}, multiattach, for project service
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: >-
      openstack volume type {{ 'create --private' if cp_gtype.rc | default(1) != 0 else 'set' }}
      --property volume_backend_name={{ cinder_backend }} --property "multiattach=<is> True"
      --project {{ cp_service_project.stdout | trim }}
      --description "Glance image volumes (multiattach)" {{ glance_volume_type }}
  vars:
    cp_gt: "{{ cp_gtype.stdout | from_json if cp_gtype.rc | default(1) == 0 else {} }}"
  when: >-
    not ansible_check_mode and (
    cp_gtype.rc | default(1) != 0
    or cp_gt.properties | default('') | string is not search('volume_backend_name\\W+' ~ cinder_backend ~ '\\b')
    or cp_gt.properties | default('') | string is not search('multiattach\\W+<is> True')
    or cp_service_project.stdout | trim not in cp_gt.access_project_ids | default('') | string)

# Every image is a volume in project service, whose Cinder default quota (10 volumes) capped the whole cloud at about
# 10 images and made concurrent uploads and snapshots fail ("VolumeLimitExceeded" in Glance, HTTP 500; found
# 2026-11-14 with Tempest). The array's realm or pod quota is the real limit.
- name: Cinder quota of project service (current)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack quota show --volume {{ cp_service_project.stdout | trim }} -f json
  register: cp_service_quota
  changed_when: false
  check_mode: false                       # read-only

- name: Cinder quota of project service -> unlimited ({{ glance_service_quota | join(', ') }})
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: >-
      openstack quota set {{ glance_service_quota | map('regex_replace', '^(.*)$', '--\1 -1') | join(' ') }}
      {{ cp_service_project.stdout | trim }}
  vars:
    # quota show prints a list of {Resource, Limit} or a dict, depending on the client: normalise both.
    cp_sq_raw: "{{ cp_service_quota.stdout | from_json }}"
    cp_sq: >-
      {{ cp_sq_raw if cp_sq_raw is mapping
         else dict(cp_sq_raw | map(attribute='Resource') | zip(cp_sq_raw | map(attribute='Limit'))) }}
  when: >-
    not ansible_check_mode
    and glance_service_quota | reject('in', cp_sq | dict2items | selectattr('value', 'equalto', -1)
                                        | map(attribute='key') | list) | list | length > 0

# Images uploaded before (or by a Glance without) cinder_volume_type: their volumes (image-<id>, project service) go to
# the multiattach type by a retype on the same back end (no data copy, image IDs unchanged).
- name: Image volumes (project service)
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack volume list --project {{ cp_service_project.stdout | trim }} --long -f json
  register: cp_image_vols
  changed_when: false
  check_mode: false                       # read-only

- name: Image volumes -> {{ glance_volume_type }}
  kubernetes.core.k8s_exec:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    command: openstack volume set --type {{ glance_volume_type }} --retype-policy never {{ item.ID }}
  loop: >-
    {{ cp_image_vols.stdout | from_json | selectattr('Name', 'match', 'image-')
       | rejectattr('Type', 'equalto', glance_volume_type) | selectattr('Status', 'equalto', 'available') | list }}
  loop_control:
    label: "{{ item.Name }} ({{ item.Type }})"
  when: not ansible_check_mode

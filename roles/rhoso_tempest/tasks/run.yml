---
# One Tempest run (loop_var tr).
- name: "{{ tr.name }}: Tempest CR (created once)"
  kubernetes.core.k8s:
    definition:
      apiVersion: test.openstack.org/v1beta1
      kind: Tempest
      metadata:
        name: "{{ tr.name }}"
        namespace: "{{ rhoso_namespace }}"
      spec:
        # tempest cleanup after the run: objects of interrupted or failed tests (projects, users, servers, networks).
        cleanup: true
        networkAttachments: ["{{ tempest_nad }}"]
        storageClass: "{{ e.rhoso.controlplane.storage_class }}"
        tempestRun: >-
          {{ {'concurrency': tempest_concurrency,
              'excludeList': tempest_exclude.splitlines() | map('trim') | select('match', '^[^#]') | join(tp_nl)}
             | combine({'smoke': true} if tr.smoke
                        else {'includeList': tp_include_auto if tr.include == 'auto' else tr.include}) }}
        tempestconfRun:
          create: true
          networkID: "{{ tp_net.stdout | trim }}"
          image: "{{ tempest_image_url }}"
          deployerInput: "{{ tempest_deployer_input }}"
          overrides: "{{ tempest_overrides | join(' ') }}"
  register: tp_cr
  # Only new (or just deleted by "Start over") runs: a spec change on a finished CR could make the operator run it again.
  when: >-
    tr.name not in tp_now.resources | map(attribute='metadata.name') | list
    or tempest_rerun | default(false) | bool or tr.fresh | default(false)

# The CR's conditions are no end marker: a run with failed tests ends with the pod in Failed and the CR reading
# "NetworkAttachments error" (the finished pod has no interfaces left). The pod phase is.
- name: "{{ tr.name }}: finished (its pod Succeeded or Failed)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ rhoso_namespace }}"
    label_selectors: ["instanceName={{ tr.name }}"]
  register: tp_pods
  until: >-
    tp_pods.resources | length > 0
    and tp_pods.resources | map(attribute='status.phase') | reject('in', ['Succeeded', 'Failed']) | list | length == 0
  retries: "{{ (tr.timeout_min * 60 / 30) | int }}"
  delay: 30
  failed_when: false

- name: "{{ tr.name }}: pod log"
  kubernetes.core.k8s_log:
    namespace: "{{ rhoso_namespace }}"
    name: "{{ (tp_pods.resources | sort(attribute='metadata.creationTimestamp') | last).metadata.name }}"
  register: tp_log
  when: tp_pods.resources | length > 0
  failed_when: false

- name: "{{ tr.name }}: keep the log"
  ansible.builtin.copy:
    content: "{{ tp_log.log | default('') }}"
    dest: "{{ tp_dir }}/{{ tr.name }}.log"
    mode: "0600"
  when: tp_log is not skipped

- name: "{{ tr.name }}: totals"
  ansible.builtin.debug:
    msg:
      - "pod: {{ tp_pods.resources | map(attribute='status.phase') | join(', ') }}"
      - "plugins left out (service not deployed): {{ tp_plugins_left_out | join(', ') }}"
      - "{{ (tp_log.log | default('')).splitlines() | select('search', '^ ?- (Passed|Skipped|Expected Fail|Unexpected Success|Failed): ') | list }}"
      - >-
        {{ (tp_log.log | default('')).splitlines() | select('search', '[.][.][.] FAILED$')
           | map('regex_replace', '^[{][0-9]+[}] ', '') | map('regex_replace', ' [[][0-9.]+s[]] [.][.][.] FAILED$', '')
           | list }}
      - "log: .state/{{ env }}/tempest/{{ tr.name }}.log"

---
# Tenant network + router on the external network, one CirrOS instance pinned to every compute with a floating IP, all
# in the admin project, named verify-* and tagged (Neutron) rhoso-verify, referenced by ID. (No separate project: the
# openstackclient pod's CLI ignores --os-project-name, so objects landed in admin anyway and escaped cleanup.)
# Checks: placement, DHCP/metadata (the key reaches the instance), north-south SSH from the jump box's test leg,
# east-west pings between all instances at the network's MTU.
- name: "Nothing left from a previous run (keep=true leaves it, run --tags cleanup)"
  ansible.builtin.assert:
    that: vr_leftovers | length == 0
    fail_msg: "left from a previous run: {{ vr_leftovers }}; run playbooks/verify.yml -e env={{ env }} --tags cleanup first"
    quiet: true

- name: SSH key for the instances
  community.crypto.openssh_keypair:
    path: "{{ vr_key }}"
    type: rsa
    size: 3072
    comment: rhoso-verify

- name: Public key into the pod
  kubernetes.core.k8s_cp:
    namespace: "{{ rhoso_namespace }}"
    pod: openstackclient
    local_path: "{{ vr_key }}.pub"
    remote_path: "{{ verify_pod_dir }}/rhoso-verify.pub"
    state: to_pod

- name: Keypair
  kubernetes.core.k8s_exec:
    command: "{{ item }}"
  loop:
    - openstack keypair delete {{ verify_keypair }}
    - openstack keypair create {{ verify_keypair }} --public-key {{ verify_pod_dir }}/rhoso-verify.pub
  register: vr_kp
  changed_when: true
  # deleting a keypair that doesn't exist is fine (first run)
  failed_when: vr_kp.rc | default(0) != 0 and item is not search('keypair delete')

- name: Security group, tenant network and subnet, router (tagged {{ verify_tag }})
  kubernetes.core.k8s_exec:
    command: "{{ item }}"
  loop:
    - openstack security group create {{ verify_prefix }}-sg --tag {{ verify_tag }} -f json
    - openstack network create {{ verify_prefix }}-net --tag {{ verify_tag }} -f json
    - openstack router create {{ verify_prefix }}-router --tag {{ verify_tag }} -f json
  register: vr_objs
  changed_when: true
  failed_when: vr_objs.rc | default(0) != 0

- name: Their IDs
  ansible.builtin.set_fact:
    vr_sg: "{{ (vr_objs.results[0].stdout | from_json).id }}"
    vr_net_id: "{{ (vr_objs.results[1].stdout | from_json).id }}"
    vr_router: "{{ (vr_objs.results[2].stdout | from_json).id }}"

- name: Subnet
  kubernetes.core.k8s_exec:
    command: >-
      openstack subnet create {{ verify_prefix }}-subnet --network {{ vr_net_id }} --subnet-range {{ verify_tenant_cidr }}
      --tag {{ verify_tag }} -f json
  register: vr_subnet
  changed_when: true
  failed_when: vr_subnet.rc | default(0) != 0

- name: Rules, router gateway and interface
  kubernetes.core.k8s_exec:
    command: "{{ item }}"
  loop:
    - openstack security group rule create {{ vr_sg }} --ingress --protocol icmp
    - openstack security group rule create {{ vr_sg }} --ingress --protocol tcp --dst-port 22
    - openstack router set {{ vr_router }} --external-gateway {{ verify_external_network }}
    - openstack router add subnet {{ vr_router }} {{ (vr_subnet.stdout | from_json).id }}
  register: vr_wire
  changed_when: true
  failed_when: vr_wire.rc | default(0) != 0

- name: Tenant network MTU
  kubernetes.core.k8s_exec:
    command: "openstack network show {{ vr_net_id }} -f json"
  register: vr_net
  changed_when: false
  failed_when: vr_net.rc | default(0) != 0

# Port binding per compute first: Neutron (OVN) must find each compute's chassis. Right after a data-plane redeploy
# it refused for a while ("Refusing to bind port ... due to no OVN chassis for host"), so every instance went ERROR.
- name: Port binding on each compute (temporary port, deleted right away)
  kubernetes.core.k8s_exec:
    command: >-
      openstack port create {{ verify_prefix }}-bind-{{ item.split('.')[0] }} --network {{ vr_net_id }} --host {{ item }}
      --tag {{ verify_tag }} -f json
  loop: "{{ vr_hosts }}"
  register: vr_bind
  changed_when: true
  failed_when: false

- name: Remove the binding-test ports
  kubernetes.core.k8s_exec:
    command: "openstack port delete {{ (item.stdout | from_json).id }}"
  loop: "{{ vr_bind.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  failed_when: false

# --wait prints progress before the JSON: the result is read back with `server show`, never parsed here.
- name: One instance per compute (pinned with --availability-zone nova:<host>)
  kubernetes.core.k8s_exec:
    command: >-
      openstack server create {{ verify_prefix }}-{{ item.split('.')[0] }} --flavor {{ verify_flavors[0].name }}
      --image {{ verify_image.name }} --network {{ vr_net_id }} --security-group {{ vr_sg }}
      --key-name {{ verify_keypair }} --availability-zone nova:{{ item }} --wait
  loop: "{{ vr_hosts }}"
  register: vr_servers
  changed_when: true
  failed_when: false

- name: Instance status after the build
  kubernetes.core.k8s_exec:
    command: "openstack server show {{ verify_prefix }}-{{ item.split('.')[0] }} -f json"
  loop: "{{ vr_hosts }}"
  register: vr_built
  changed_when: false
  failed_when: false

- name: ACTIVE instances (only these get a floating IP; the others are recorded as FAIL with their fault)
  ansible.builtin.set_fact:
    vr_active_hosts: >-
      {{ vr_built.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
         | selectattr('stdout', 'search', '"status": "ACTIVE"') | map(attribute='item') | list }}

- name: Floating IPs (tagged {{ verify_tag }})
  kubernetes.core.k8s_exec:
    command: "openstack floating ip create {{ verify_external_network }} --tag {{ verify_tag }} -f json"
  loop: "{{ vr_active_hosts }}"
  register: vr_fips
  changed_when: true
  failed_when: vr_fips.rc | default(0) != 0

- name: Attach them
  kubernetes.core.k8s_exec:
    command: >-
      {{ vos }} server add floating ip {{ verify_prefix }}-{{ item.0.split('.')[0] }} {{ (item.1.stdout | from_json).floating_ip_address }}
  loop: "{{ vr_active_hosts | zip(vr_fips.results) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ (item.1.stdout | from_json).floating_ip_address }}"
  register: vr_fip_add
  changed_when: true
  failed_when: vr_fip_add.rc | default(0) != 0

- name: Instance details
  kubernetes.core.k8s_exec:
    command: "{{ vos }} server show {{ verify_prefix }}-{{ item.split('.')[0] }} -f json"
  loop: "{{ vr_hosts }}"
  register: vr_show
  changed_when: false
  failed_when: false

- name: Instances
  ansible.builtin.set_fact:
    vr_vms: >-
      {%- set out = [] -%}
      {%- for r in vr_show.results if r.rc | default(1) == 0 -%}
      {%-   set s = r.stdout | from_json -%}
      {%-   set addrs = s.addresses[verify_prefix ~ '-net'] | default([]) -%}
      {%-   set fixed = addrs | select('match', (verify_tenant_cidr.split('/')[0].rsplit('.', 1)[0] | regex_escape) ~ '\\.') | list -%}
      {%-   set fips = addrs | reject('in', fixed) | list -%}
      {%-   set _ = out.append({'name': s.name, 'id': s.id, 'want': r.item, 'host': s['OS-EXT-SRV-ATTR:host'] | default(''),
                                'status': s.status, 'fixed': fixed | first | default(''), 'fip': fips | first | default('')}) -%}
      {%- endfor -%}
      {{ out }}

- name: Wait for SSH on the floating IPs (from the jump box's test leg)
  ansible.builtin.wait_for:
    host: "{{ item.fip }}"
    port: 22
    timeout: 300
    search_regex: SSH
  loop: "{{ vr_vms | selectattr('fip') | list }}"
  loop_control:
    label: "{{ item.name }} {{ item.fip }}"
  register: vr_ssh_port
  ignore_errors: true                     # recorded as a FAIL check below; the run goes on

- name: Instances as hosts (raw, CirrOS has no Python)
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    groups: [verify_vms]
    ansible_host: "{{ item.fip }}"
    ansible_user: "{{ verify_image.user }}"
    ansible_ssh_private_key_file: "{{ vr_key }}"
    ansible_python_interpreter: /bin/false
  loop: "{{ vr_vms | selectattr('fip') | list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Inside each instance (key from metadata, address from DHCP, MTU)
  ansible.builtin.raw: ip -4 -o addr show dev eth0; cat /sys/class/net/eth0/mtu
  delegate_to: "{{ item.name }}"
  loop: "{{ vr_vms | selectattr('fip') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: vr_inside
  changed_when: false
  failed_when: false

- name: East-west from the first instance to every other one ({{ (vr_net.stdout | from_json).mtu }} MTU)
  ansible.builtin.raw: ping -c 3 -W 2 -s {{ (vr_net.stdout | from_json).mtu | int - 28 }} {{ item.fixed }}
  delegate_to: "{{ vr_vms[0].name }}"
  loop: "{{ vr_vms[1:] }}"
  loop_control:
    label: "{{ vr_vms[0].name }} -> {{ item.name }} {{ item.fixed }}"
  register: vr_ew
  changed_when: false
  failed_when: false
  when: vr_vms | length > 1 and vr_vms[0].fip | length > 0

# The subnet has no dns_nameservers: OVN DHCP hands out Neutron's [ovn] dns_servers (the lab DNS); the router
# masquerades the queries. A lab name and an internet name must both resolve.
- name: DNS inside the first instance
  ansible.builtin.raw: nslookup {{ item }}
  delegate_to: "{{ vr_vms[0].name }}"
  loop: "{{ ['api.' ~ e.domain, 'registry.redhat.io'] }}"     # a lab name (the cluster's AD zone) and an internet name
  register: vr_dns
  changed_when: false
  failed_when: false
  when: vr_vms | length > 0 and vr_vms[0].fip | length > 0

- name: Internet from the first instance (through the router's source NAT)
  ansible.builtin.raw: ping -c 3 -W 2 1.1.1.1
  delegate_to: "{{ vr_vms[0].name }}"
  register: vr_inet
  changed_when: false
  failed_when: false
  when: vr_vms | length > 0 and vr_vms[0].fip | length > 0

- name: Checks
  ansible.builtin.include_tasks: check.yml
  loop: >-
    {%- set out = [{'phase': 'smoke', 'name': 'computes enabled and up', 'ok': vr_hosts | length == e.edpm_hosts | length,
                    'detail': (vr_hosts | length) ~ ' of ' ~ (e.edpm_hosts | length) ~ ' edpm_hosts'}] -%}
    {%- for r in vr_bind.results -%}
    {%-   set p = (r.stdout | default('{}') | from_json) if r.rc | default(1) == 0 else {} -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'port binding on ' ~ r.item.split('.')[0],
            'ok': p.binding_vif_type | default('') not in ['', 'binding_failed', 'unbound'],
            'detail': p.binding_vif_type | default(r.stderr | default('') | trim | truncate(150))}) -%}
    {%- endfor -%}
    {%- for r in vr_built.results -%}
    {%-   set b = (r.stdout | default('{}') | from_json) if r.rc | default(1) == 0 else {} -%}
    {%-   set v = vr_vms | selectattr('want', 'equalto', r.item) | first | default({}) -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'instance on ' ~ r.item.split('.')[0],
            'ok': b.status | default('') == 'ACTIVE' and b['OS-EXT-SRV-ATTR:host'] | default('') == r.item,
            'detail': (b.status | default('?') ~ ' on ' ~ b['OS-EXT-SRV-ATTR:host'] | default('-'))
                      ~ ((': ' ~ (b.fault.message | default(''))) if b.fault is defined and b.fault else '')}) -%}
    {%- endfor -%}
    {%- for r in vr_ssh_port.results | default([]) -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'north-south: SSH to ' ~ r.item.name ~ ' floating IP',
            'ok': r.failed is not defined or not r.failed, 'detail': r.item.fip ~ (' ' ~ r.msg if r.msg is defined else '')}) -%}
    {%- endfor -%}
    {%- for r in vr_inside.results | default([]) -%}
    {%-   set lines = (r.stdout | default('')).splitlines() -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'login with the metadata key, DHCP address, MTU: ' ~ r.item.name,
            'ok': r.rc | default(1) == 0 and r.item.fixed in r.stdout | default('')
                  and (lines | last | default('') | trim) == ((vr_net.stdout | from_json).mtu | string),
            'detail': 'mtu ' ~ (lines | last | default('?') | trim) ~ ', ' ~ r.item.fixed}) -%}
    {%- endfor -%}
    {%- for r in vr_ew.results | default([]) if r.skipped is not defined -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'east-west: ' ~ vr_vms[0].name ~ ' -> ' ~ r.item.name,
            'ok': r.rc | default(1) == 0, 'detail': (r.stdout | default('') | regex_search('\\d+% packet loss') | default('', true))}) -%}
    {%- endfor -%}
    {%- set want_mtu = e.rhoso.controlplane.tenant_mtu | default(none) -%}
    {%- set _ = out.append({'phase': 'smoke', 'name': 'tenant network MTU',
          'ok': none if want_mtu is none else ((vr_net.stdout | from_json).mtu | int == want_mtu | int),
          'detail': 'geneve network MTU ' ~ (vr_net.stdout | from_json).mtu ~ (('' if want_mtu is none else ', wanted ' ~ want_mtu)
                    ~ ' (Neutron [ml2] path_mtu)')}) -%}
    {%- for r in vr_dns.results | default([]) if r.skipped is not defined -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'DNS in the instance: ' ~ r.item,
            'ok': r.rc | default(1) == 0 and (r.stdout | default('')) is search('Name:|canonical name')
                  and (r.stdout | default('')) is not search("can't find|can't resolve|NXDOMAIN|timed out"),
            'detail': ('resolved through ' ~ (r.stdout | default('') | regex_search('Server:\s*(\S+)', '\\1') | first | default('?')))
                      if (r.stdout | default('')) is search('Name:|canonical name')
                      else (r.stdout | default('no answer') | regex_search("(can't find|can't resolve|timed out)[^\n]*") | default('no answer', true))}) -%}
    {%- endfor -%}
    {%- if vr_inet is defined and vr_inet.skipped is not defined -%}
    {%-   set _ = out.append({'phase': 'smoke', 'name': 'internet from the instance (router source NAT)',
            'ok': vr_inet.rc | default(1) == 0,
            'detail': vr_inet.stdout | default('') | regex_search('[0-9]+% packet loss') | default('no reply', true)}) -%}
    {%- endif -%}
    {{ out }}
  loop_control:
    loop_var: chk
    label: "{{ chk.name }}"

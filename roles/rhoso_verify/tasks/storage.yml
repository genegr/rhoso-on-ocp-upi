---
# Pure iSCSI from the computes: a volume attached to the first instance (multipath on its compute, write/read in the
# guest), and an instance booted from a volume.
# iSCSI records made on a compute outside OpenStack, by an iscsiadm newer than nova_compute's, make every os-brick call
# on that target fail (found 2026-11-14 on two computes: "Unknown parameter name node.session.conn_reopen_log_freq",
# every attach failed). Read-only: the record files, for that parameter (podman exec over SSH is refused on the
# computes: "nsenter: stat of /proc/1/ns/user failed").
- name: iSCSI records nova_compute's iscsiadm can't read (all computes)
  ansible.builtin.find:
    paths: /var/lib/iscsi/nodes
    patterns: default
    recurse: true
    contains: '^node\.session\.conn_reopen_log_freq'
  delegate_to: "{{ item }}"
  loop: "{{ groups['edpm'] }}"
  register: vr_iscsi_recs

- name: Record the unreadable iSCSI records
  ansible.builtin.include_tasks: check.yml
  vars:
    vr_bad_recs: "{{ vr_iscsi_recs.results | selectattr('matched', 'gt', 0) | map(attribute='item') | list }}"
    chk:
      phase: storage
      name: iSCSI records readable by nova_compute on every compute
      ok: "{{ vr_bad_recs | length == 0 }}"
      detail: >-
        {{ ('unreadable on ' ~ vr_bad_recs | join(', ') ~ ' (host-made records? log out, remove them)') if vr_bad_recs
           else 'all ' ~ groups['edpm'] | length ~ ' computes' }}

- name: Volume {{ verify_prefix }}-vol ({{ verify_volume_gb }} GB, type {{ cinder_volume_type | default('pure') }})
  kubernetes.core.k8s_exec:
    command: >-
      {{ vos }} volume create {{ verify_prefix }}-vol --size {{ verify_volume_gb }}
      --type {{ cinder_volume_type | default('pure') }} -f json
  register: vr_vol
  changed_when: true
  failed_when: vr_vol.rc | default(0) != 0

- name: Volume available
  kubernetes.core.k8s_exec:
    command: "{{ vos }} volume show {{ verify_prefix }}-vol -f value -c status"
  register: vr_vol_state
  until: vr_vol_state.stdout | trim in ['available', 'error']
  retries: 30
  delay: 5
  changed_when: false
  failed_when: vr_vol_state.stdout | trim != 'available'

- name: Attach it to {{ vr_vms[0].name }}
  kubernetes.core.k8s_exec:
    command: "{{ vos }} server add volume {{ vr_vms[0].id }} {{ verify_prefix }}-vol"
  register: vr_attach
  changed_when: true
  failed_when: vr_attach.rc | default(0) != 0

- name: Volume in-use
  kubernetes.core.k8s_exec:
    command: "{{ vos }} volume show {{ verify_prefix }}-vol -f value -c status"
  register: vr_vol_state
  until: vr_vol_state.stdout | trim in ['in-use', 'error', 'error_attaching']
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false

- name: Multipath on {{ vr_vms[0].host }}
  ansible.builtin.command: multipath -ll
  delegate_to: "{{ vr_vms[0].host.split('.')[0] }}"
  register: vr_mp
  changed_when: false
  failed_when: false

- name: iSCSI sessions on {{ vr_vms[0].host }}
  ansible.builtin.command: iscsiadm -m session
  delegate_to: "{{ vr_vms[0].host.split('.')[0] }}"
  register: vr_iscsi
  changed_when: false
  failed_when: false

# The bus (virtio-blk vdX or virtio-scsi sdX) depends on the image/flavor: take the second disk, whatever its name.
- name: The disk inside the guest
  ansible.builtin.raw: ls /sys/block | grep -E '^(vd|sd)[a-z]$' | sort | sed -n 2p
  delegate_to: "{{ vr_vms[0].name }}"
  register: vr_vdb
  until: vr_vdb.stdout | default('') | trim | length > 0
  retries: 12
  delay: 5
  changed_when: false
  failed_when: false

- name: Guest disk
  ansible.builtin.set_fact:
    vr_gdisk: "{{ vr_vdb.stdout | default('') | trim }}"

- name: Write a marker and read it back (raw device, then dropped caches)
  ansible.builtin.raw: >-
    echo {{ verify_marker }} | sudo dd of=/dev/{{ vr_gdisk }} bs=512 count=1 conv=sync,fsync 2>/dev/null &&
    sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' &&
    sudo dd if=/dev/{{ vr_gdisk }} bs=512 count=1 2>/dev/null | head -c {{ verify_marker | length }}
  delegate_to: "{{ vr_vms[0].name }}"
  register: vr_marker
  changed_when: false
  failed_when: false
  when: vr_gdisk | length > 0

# Volume from the image: cinder-volume (on an OCP node) writes the image into a new Pure volume, i.e. an attach on a
# master, the path the realm hosts broke. Named, so cleanup finds it.
- name: Root volume {{ verify_prefix }}-bfv-root from the image
  kubernetes.core.k8s_exec:
    command: >-
      {{ vos }} volume create {{ verify_prefix }}-bfv-root --image {{ verify_image.name }} --size {{ verify_volume_gb }}
      --type {{ cinder_volume_type | default('pure') }} --bootable -f json
  register: vr_bfv_vol
  changed_when: true
  failed_when: vr_bfv_vol.rc | default(0) != 0

- name: Root volume available
  kubernetes.core.k8s_exec:
    command: "{{ vos }} volume show {{ (vr_bfv_vol.stdout | from_json).id }} -f value -c status"
  register: vr_bfv_vol_state
  until: vr_bfv_vol_state.stdout | trim in ['available', 'error']
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false

- name: Boot-from-volume instance on {{ vr_hosts[1] | default(vr_hosts[0]) }}
  kubernetes.core.k8s_exec:
    command: >-
      {{ vos }} server create {{ verify_prefix }}-bfv --flavor {{ verify_flavors[1].name }}
      --volume {{ (vr_bfv_vol.stdout | from_json).id }} --network {{ vr_net_id }} --security-group {{ vr_sg }}
      --key-name {{ verify_keypair }} --availability-zone nova:{{ vr_hosts[1] | default(vr_hosts[0]) }} --wait
  register: vr_bfv
  changed_when: true
  failed_when: false
  when: vr_bfv_vol_state.stdout | trim == 'available'

# --wait prints progress to stdout before the JSON: read the server back instead of parsing the create output.
- name: Boot-from-volume instance details
  kubernetes.core.k8s_exec:
    command: "{{ vos }} server show {{ verify_prefix }}-bfv -f json"
  register: vr_bfv_show
  changed_when: false
  failed_when: false

- name: Floating IP for it
  kubernetes.core.k8s_exec:
    command: "{{ vos }} floating ip create {{ verify_external_network }} --tag {{ verify_tag }} -f json"
  register: vr_bfv_fip
  changed_when: true
  failed_when: vr_bfv_fip.rc | default(0) != 0
  when: >-
    vr_bfv_show.stdout | default('') is search('"status": "ACTIVE"')

- name: Attach it
  kubernetes.core.k8s_exec:
    command: >-
      {{ vos }} server add floating ip {{ verify_prefix }}-bfv {{ (vr_bfv_fip.stdout | from_json).floating_ip_address }}
  register: vr_bfv_add
  changed_when: true
  failed_when: vr_bfv_add.rc | default(0) != 0
  when: vr_bfv_fip is not skipped and vr_bfv_fip.rc | default(1) == 0

- name: SSH on the boot-from-volume instance
  ansible.builtin.wait_for:
    host: "{{ (vr_bfv_fip.stdout | from_json).floating_ip_address }}"
    port: 22
    timeout: 300
    search_regex: SSH
  register: vr_bfv_ssh
  ignore_errors: true
  when: vr_bfv_add is not skipped and vr_bfv_add.rc | default(1) == 0

- name: Checks
  ansible.builtin.include_tasks: check.yml
  loop:
    - phase: storage
      name: volume attached (in-use)
      ok: "{{ vr_vol_state.stdout | default('') | trim == 'in-use' }}"
      detail: "{{ vr_vol_state.stdout | default('') | trim }}"
    - phase: storage
      name: "multipath on {{ vr_vms[0].host.split('.')[0] }}: PURE device, >= 2 active paths"
      ok: "{{ 'PURE' in vr_mp.stdout | default('') and (vr_mp.stdout | default('') | regex_findall('active ready running') | length) >= 2 }}"
      detail: "{{ vr_mp.stdout | default('') | regex_findall('active ready running') | length }} active paths"
    - phase: storage
      name: "iSCSI sessions on both fabrics"
      ok: >-
        {{ e.flasharray.iscsi_portals.storage | select('in', vr_iscsi.stdout | default('')) | list | length > 0
           and e.flasharray.iscsi_portals.storage_b | select('in', vr_iscsi.stdout | default('')) | list | length > 0 }}
      detail: "{{ vr_iscsi.stdout_lines | default([]) | length }} sessions"
    - phase: storage
      name: guest writes and reads the volume
      ok: "{{ (vr_marker.stdout | default('') | trim) == verify_marker }}"
      detail: "{{ 'no second disk in the guest' if vr_gdisk | default('') | length == 0 else ('/dev/' ~ vr_gdisk ~ ': ') ~ (vr_marker.stdout | default('') | trim) }}"
    - phase: storage
      name: volume from the image (cinder-volume attaches on an OCP node)
      ok: "{{ vr_bfv_vol_state.stdout | default('') | trim == 'available' }}"
      detail: "{{ vr_bfv_vol_state.stdout | default('') | trim }}"
    - phase: storage
      name: boot-from-volume instance ACTIVE and reachable
      ok: "{{ (vr_bfv_show.stdout | default('{}') | from_json).status | default('?') == 'ACTIVE' and vr_bfv_ssh is not skipped and not (vr_bfv_ssh.failed | default(true)) }}"
      detail: "{{ (vr_bfv_show.stdout | default('{}') | from_json).status | default('not created') }}{{ (' ' ~ (vr_bfv_fip.stdout | from_json).floating_ip_address) if vr_bfv_fip.stdout | default('') | length > 0 else '' }}{{ (': ' ~ (vr_bfv_show.stdout | from_json).fault.message | default('')) if (vr_bfv_show.stdout | default('{}') | from_json).fault | default(none) else '' }}"
  loop_control:
    loop_var: chk
    label: "{{ chk.name }}"

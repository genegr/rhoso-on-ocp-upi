---
# Remove every test object (leftovers.yml finds them by name and tag, so a partial or interrupted run is covered too)
# and the keypair. The kept objects (external network, flavors, image) are never touched.
- name: Test objects
  ansible.builtin.include_tasks: leftovers.yml

- name: Delete the instances
  kubernetes.core.k8s_exec:
    command: "openstack server delete --wait {{ vr_lo.servers | map(attribute='ID') | join(' ') }}"
  when: vr_lo.servers | length > 0
  register: vr_c_srv
  changed_when: true
  failed_when: vr_c_srv.rc | default(0) != 0

- name: Delete the floating IPs
  kubernetes.core.k8s_exec:
    command: "openstack floating ip delete {{ vr_lo.fips | map(attribute='ID') | join(' ') }}"
  when: vr_lo.fips | length > 0
  register: vr_c_fip
  changed_when: true
  failed_when: vr_c_fip.rc | default(0) != 0

# Detached once their servers are gone.
- name: Volumes detached
  kubernetes.core.k8s_exec:
    command: "openstack volume show {{ item.ID }} -f value -c status"
  loop: "{{ vr_lo.volumes }}"
  loop_control:
    label: "{{ item.Name }}"
  register: vr_c_vstate
  until: vr_c_vstate.stdout | default('') | trim not in ['in-use', 'detaching', 'attaching', 'deleting']
  retries: 24
  delay: 5
  changed_when: false
  failed_when: false

- name: Delete the volumes
  kubernetes.core.k8s_exec:
    command: "openstack volume delete {{ vr_lo.volumes | map(attribute='ID') | join(' ') }}"
  when: vr_lo.volumes | length > 0
  register: vr_c_vol
  changed_when: true
  failed_when: vr_c_vol.rc | default(0) != 0

- name: Router interfaces (current)
  kubernetes.core.k8s_exec:
    command: "openstack port list --router {{ item.ID }} --device-owner network:router_interface -f json --long"
  loop: "{{ vr_lo.routers }}"
  loop_control:
    label: "{{ item.Name }}"
  register: vr_c_rports
  changed_when: false

- name: Routers (gateway, interfaces, router)
  kubernetes.core.k8s_exec:
    command: "{{ item }}"
  loop: >-
    {%- set out = [] -%}
    {%- for r in vr_c_rports.results | default([]) -%}
    {%-   set _ = out.append('openstack router unset --external-gateway ' ~ r.item.ID) -%}
    {%-   for p in r.stdout | default('[]') | from_json -%}
    {%-     for ip in p['Fixed IP Addresses'] | default([]) -%}
    {%-       set _ = out.append('openstack router remove subnet ' ~ r.item.ID ~ ' ' ~ ip.subnet_id) -%}
    {%-     endfor -%}
    {%-   endfor -%}
    {%-   set _ = out.append('openstack router delete ' ~ r.item.ID) -%}
    {%- endfor -%}
    {{ out }}
  register: vr_c_rtr
  changed_when: true
  failed_when: vr_c_rtr.rc | default(0) != 0 and item is search(' router delete ')

- name: Networks (with their subnets) and security groups
  kubernetes.core.k8s_exec:
    command: "{{ item }}"
  loop: >-
    {{ (vr_lo.networks | map(attribute='ID') | map('regex_replace', '^', 'openstack network delete ') | list)
       + (vr_lo.security_groups | map(attribute='ID') | map('regex_replace', '^', 'openstack security group delete ') | list) }}
  register: vr_c_net
  changed_when: true
  failed_when: vr_c_net.rc | default(0) != 0

- name: Keypair and the pod's copy of its public key
  kubernetes.core.k8s_exec:
    command: "{{ item }}"
  loop:
    - openstack keypair delete {{ verify_keypair }}
    - rm -f {{ verify_pod_dir }}/rhoso-verify.pub
  changed_when: false
  failed_when: false

- name: Test objects after the cleanup
  ansible.builtin.include_tasks: leftovers.yml

- name: Nothing left
  ansible.builtin.assert:
    that: vr_leftovers | length == 0
    fail_msg: "still there: {{ vr_leftovers }}"
    quiet: true

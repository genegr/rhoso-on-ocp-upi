[defaults]
inventory = inventory/hosts.yml
# /ocp/roles: generic roles reused from the OCP repo (olm_operator), mounted read-only by compose.yaml.
roles_path = roles:/ocp/roles
library = plugins/modules:/ocp/plugins/modules
collections_path = /usr/share/ansible/collections
vault_password_file = .state/vault-pass
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
local_tmp = .state/ansible/tmp

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path_dir = .state/ansible/cp

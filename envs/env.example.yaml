# Example environment (RFC 5737 addresses, example.com). Copy to envs/<env>.yaml (gitignored) and fill in.
# Secrets never go here: they live in envs/vault.yml (Ansible Vault, see vault.yml.example).
env: example
ocp_cluster: example              # cluster name in ../ocp-upi-baremetal-vms/clusters/<name>.yaml
domain: example.example.com       # <cluster>.<base domain>

jumpbox:
  hostname: jumpbox
  user: ocpadmin
  mac: "00:50:56:00:00:20"        # manual MAC set on the primary vNIC before first boot (netplan matches it)
  ip: 192.0.2.20
  prefix: 24
  extra_ips: [192.0.2.21, 192.0.2.22]   # HAProxy VIPs (API, ingress)
  gateway: 192.0.2.1
  dns_servers: [192.0.2.100]
  search_domain: example.com
  ssh_authorized_keys: []         # public keys only
  vm: {name: jumpbox, cpus: 4, memory_mb: 16384, disk_gb: 100, network: "VM Network"}
  # Test vNICs for netcheck (hot-added by netcheck_vsphere.yml). vlan: null = access port group; a number = tagged
  # on a trunk port group (several entries may then share one portgroup/ifname).
  test_nics:
    - {network: ctlplane,    portgroup: RHOSO-MGMT,        ifname: ens224, vlan: null}
    - {network: internalapi, portgroup: RHOSO-INTERNALAPI, ifname: ens256, vlan: null}
    - {network: tenant,      portgroup: RHOSO-TENANT,      ifname: ens161, vlan: null}
    - {network: storage,     portgroup: RHOSO-ISCSI-A,     ifname: ens193, vlan: null}
    - {network: storage_b,   portgroup: RHOSO-ISCSI-B,     ifname: ens225, vlan: null}

# Docker Engine for the jump box (download.docker.com, Ubuntu 26.04 "resolute"); releases at least two weeks old.
docker:
  suite: resolute
  gpg_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
  packages:
    docker-ce: "5:29.9.2-1~ubuntu.26.04~resolute"
    docker-ce-cli: "5:29.9.2-1~ubuntu.26.04~resolute"
    containerd.io: "2.4.2-3~ubuntu.26.04~resolute"
    docker-buildx-plugin: "0.38.1-1~ubuntu.26.04~resolute"
    docker-compose-plugin: "5.6.1-1~ubuntu.26.04~resolute"

vsphere:
  server: vcenter.example.com
  datacenter: DC
  cluster: Cluster
  esxi_host: esxi1.example.com
  # Dedicated port groups (the existing management group stays untouched). relaxed = promiscuous, forged
  # transmits and MAC changes accepted (macvlan NADs). vswitch: standard vSwitch, or dvswitch: <VDS name>.
  portgroups:
    - {name: RHOSO-MGMT,        vswitch: vSwitch0, vlan_id: 100, relaxed: true}
    - {name: RHOSO-INTERNALAPI, vswitch: vSwitch0, vlan_id: 101, relaxed: true}
    - {name: RHOSO-TENANT,      vswitch: vSwitch0, vlan_id: 102, relaxed: true}
    - {name: RHOSO-ISCSI-A,     vswitch: vSwitch1, vlan_id: 103, relaxed: true}
    - {name: RHOSO-ISCSI-B,     vswitch: vSwitch2, vlan_id: 104, relaxed: true}

ad:
  server: 192.0.2.100             # AD DC: DNS for the cluster, managed over WinRM

# Bare-metal data-plane hosts (pre-provisioned RHEL 9). model selects the NIC layout.
edpm_hosts:
  # iscsi_nics/iscsi_ips: one per fabric; trunk_nic (optional) = NIC carrying the L2 VLANs.
  - {name: compute-0, ip: 192.0.2.12, model: model-a, iscsi_nics: [eth4, eth5], iscsi_ips: [198.51.100.142, 198.51.100.202]}
  - {name: compute-1, ip: 192.0.2.13, model: model-b, iscsi_nics: [eth2, eth3], iscsi_ips: [198.51.100.143, 198.51.100.203]}

netcheck:
  probe_ips: {ctlplane: 192.0.2.49, internalapi: 198.51.100.40, tenant: 198.51.100.104, storage: 198.51.100.170, storage_b: 198.51.100.230}
  host_ip_base: 41
  host_vlan_networks: [internalapi, tenant]
  trunk_nic: null
  mtus: [1500, 9000]
  free_ranges:
    - [192.0.2.30, 192.0.2.33]
    - [192.0.2.200, 192.0.2.250]
  urls: [https://registry.redhat.io/v2/, https://registry.connect.redhat.com/v2/, https://quay.io/v2/]
  dns_names: [registry.redhat.io, quay.io]

# Optional (edpm_prep.yml): give hosts installed with a smaller package set the reference host's packages.
# edpm_align:
#   reference: compute-1
#   hosts: [compute-4]
# Optional: edpm_rhel_release (default "9.6"), edpm_repos (default: the RHOSO 18.0 EUS set).

# Networks as proposed for RHOSO; netcheck.yml validates them (docs/network-requirements.md).
networks:
  ctlplane:    {vlan: 100, cidr: 192.0.2.0/24, gateway: 192.0.2.1, routed: true}
  internalapi: {vlan: 101, cidr: 198.51.100.0/26, routed: false}
  tenant:      {vlan: 102, cidr: 198.51.100.64/26, routed: false}
  storage:     {vlan: 103, cidr: 198.51.100.128/26, routed: false}
  storage_b:   {vlan: 104, cidr: 198.51.100.192/26, routed: false}
  external:    {vlan: 100, cidr: 192.0.2.0/24, range: [192.0.2.200, 192.0.2.250]}

# playbooks/verify.yml (functional verification, before Tempest): the external network (networks.external, a VLAN on
# physnet datacentre, /24) with a floating-IP pool (host numbers). The jump box reaches the floating IPs through a
# temporary leg: the jumpbox.test_nics entry with network: external, at jumpbox_ip.
# rhoso:
#   verify:
#     external: {gateway: 192.0.2.1, pool: [200, 239]}
#     jumpbox_ip: 192.0.2.240

flasharray:
  mgmt: 203.0.113.50
  iscsi_portals:
    storage: [198.51.100.180, 198.51.100.181]
    storage_b: [198.51.100.240, 198.51.100.241]
